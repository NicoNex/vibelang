name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # z3 is optional: the refinement tests detect it and skip the discharge
      # assertions without it. Installing it means `--prove` is actually tested.
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --verbose
      # The integration tests share one build directory, so they race in parallel.
      - run: cargo test --locked --verbose -- --test-threads=1
